plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

// tudursguns-<mod_version>-forge-1.20.1.jar, like the Fabric version's -fabric-1.21.11 (mods.toml keeps mod_version)
version = "${mod_version}-${mod_loader}-${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -PquickPlay=<save name>: opens that world straight away (for testing)
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// src/generated: produced by tools/port/port.py from the Mojang-mapped Fabric project (do not edit without
// `port.py makepatches`). src/forge: the Forge-only layer written for 1.20.1.
sourceSets.main.java { srcDirs = ['src/generated/java', 'src/forge/java'] }
sourceSets.main.resources { srcDirs = ['src/generated/resources', 'src/forge/resources'] }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.client.mixins.json"
}

repositories {
    // Tudur's Vehicle Mod (Forge): copy its jar (tudursvehiclemod-forge, ./gradlew build) into libs/
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // The vehicle mod, remapped to the development names. Its compatibility layer
    // (com.example.tudursvehiclemod.compat) is what the generated sources' Fabric/1.21 calls are redirected to.
    implementation fg.deobf("blank:tudursvehiclemod:${tudursvehiclemod_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            tudursvehiclemod_version_range: tudursvehiclemod_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
    options.encoding = 'UTF-8'
}
